[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --tb=short --browser chromium --screenshot only-on-failure
markers =
    smoke:     critical end-to-end paths (run before every release)
    happy:     happy-path test
    negative:  negative test - the app must reject bad input
    edge:      edge case
    boundary:  boundary / limit values
    security:  access-control or security check
    performance: timing / volume check
    regression: guards against a previously fixed defect
    admin:     requires an RFM Admin account
    slow:      takes longer than a few seconds
